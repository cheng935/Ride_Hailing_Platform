<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打车平台 - 登录</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 10px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .tab-buttons {
            display: flex;
            margin-bottom: 25px;
            background: #f0f0f0;
            border-radius: 10px;
            padding: 4px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: white;
            color: #667eea;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.3s;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102,126,234,0.4);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .error-msg {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
        .success-msg {
            color: #27ae60;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
        .hidden { display: none !important; }
        .form-panel { display: none; }
        .form-panel.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🚗</div>
        <h1>打车平台</h1>

        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('login')">登录</button>
            <button class="tab-btn" onclick="switchTab('register')">注册</button>
        </div>

        <!-- 登录表单 -->
        <div id="loginPanel" class="form-panel active">
            <div class="form-group">
                <label>手机号</label>
                <input type="text" id="loginPhone" placeholder="请输入手机号">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码">
            </div>
            <div class="error-msg" id="loginError"></div>
            <button class="btn btn-primary" onclick="doLogin()">登 录</button>
            <p style="text-align:center;margin-top:15px;color:#999;font-size:13px;">
                测试账号：13800000001 / 123456（乘客）<br>
                测试账号：13900000001 / 123456（司机）
            </p>
        </div>

        <!-- 注册表单 -->
        <div id="registerPanel" class="form-panel">
            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="regName" placeholder="请输入姓名">
            </div>
            <div class="form-group">
                <label>手机号</label>
                <input type="text" id="regPhone" placeholder="请输入手机号">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="regPassword" placeholder="请输入密码">
            </div>
            <div class="form-group">
                <label>角色</label>
                <select id="regRole">
                    <option value="PASSENGER">乘客</option>
                    <option value="DRIVER">司机</option>
                </select>
            </div>
            <div class="error-msg" id="regError"></div>
            <div class="success-msg" id="regSuccess"></div>
            <button class="btn btn-primary" onclick="doRegister()">注 册</button>
        </div>
    </div>

    <script>
        const API = '/api/auth';

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
            if (tab === 'login') {
                document.querySelector('.tab-btn:first-child').classList.add('active');
                document.getElementById('loginPanel').classList.add('active');
            } else {
                document.querySelector('.tab-btn:last-child').classList.add('active');
                document.getElementById('registerPanel').classList.add('active');
            }
            document.querySelectorAll('.error-msg, .success-msg').forEach(e => e.style.display = 'none');
        }

        async function doLogin() {
            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errEl = document.getElementById('loginError');

            if (!phone || !password) {
                errEl.textContent = '请填写手机号和密码';
                errEl.style.display = 'block';
                return;
            }

            try {
                const resp = await fetch(API + '/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });
                const data = await resp.json();

                if (data.code === 200) {
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('user', JSON.stringify(data.data));
                    if (data.data.role === 'DRIVER') {
                        window.location.href = '/driver.html';
                    } else {
                        window.location.href = '/passenger.html';
                    }
                } else {
                    errEl.textContent = data.message || '登录失败';
                    errEl.style.display = 'block';
                }
            } catch (e) {
                errEl.textContent = '网络错误，请检查后端是否启动';
                errEl.style.display = 'block';
            }
        }

        async function doRegister() {
            const name = document.getElementById('regName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const role = document.getElementById('regRole').value;
            const errEl = document.getElementById('regError');
            const sucEl = document.getElementById('regSuccess');

            errEl.style.display = 'none';
            sucEl.style.display = 'none';

            if (!name || !phone || !password) {
                errEl.textContent = '请填写所有字段';
                errEl.style.display = 'block';
                return;
            }

            try {
                const params = new URLSearchParams({ name, phone, password, role });
                const resp = await fetch(API + '/register?' + params, { method: 'POST' });
                const data = await resp.json();

                if (data.code === 200) {
                    sucEl.textContent = '注册成功！请切换到登录页面登录';
                    sucEl.style.display = 'block';
                    document.getElementById('regName').value = '';
                    document.getElementById('regPhone').value = '';
                    document.getElementById('regPassword').value = '';
                } else {
                    errEl.textContent = data.message || '注册失败';
                    errEl.style.display = 'block';
                }
            } catch (e) {
                errEl.textContent = '网络错误，请检查后端是否启动';
                errEl.style.display = 'block';
            }
        }

        document.getElementById('loginPhone').addEventListener('keydown', e => {
            if (e.key === 'Enter') doLogin();
        });
        document.getElementById('loginPassword').addEventListener('keydown', e => {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>
</html>
